name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.2
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "VERSION=${TAG#v}" --build-arg "COMMIT=$COMMIT" -t "ghcr.io/$OWNER/selectel-s3-mcp-ai-cli:${TAG#v}" --push .
